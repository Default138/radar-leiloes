<!doctype html>
<!--
  Modelo do site do Radar de Leilões.
  O painel.py lê este arquivo e troca os marcadores (palavras entre dois
  sublinhados, como DADOS e ATUALIZADO) pelos valores reais, gerando docs/index.html.
  Para mudar o visual, edite AQUI (não no docs/index.html, que é sobrescrito).
-->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Leilões</title>
<meta name="description" content="Veículos em leilão entre Foz do Iguaçu e Cascavel: Receita Federal, PRF, Polícia Federal, Detran-PR, Foztrans e Prefeituras.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</script>
<style>
  /* ============ CORES (tema claro) ============ */
  :root {
    --fundo: #f4f6f1;  --superficie: #ffffff;  --superficie-2: #eef2ea;
    --texto: #16201b;  --suave: #5a6660;       --borda: #dde3d8;
    --acento: #2e7d32; --acento-texto: #ffffff; --acento-suave: #e3f1de;
    --ok: #1f7a35;      --ok-fundo: #e2f4e6;
    --atencao: #9a5b00; --atencao-fundo: #fbefd9;
    --perigo: #b3261e;  --perigo-fundo: #fbe4e2;
    --info: #1d5fae;    --info-fundo: #e2edfa;
    --roxo: #6b3fa0;    --roxo-fundo: #efe6fa;
    --ardosia: #3d5170; --ardosia-fundo: #e4e9f2;
    --turquesa: #00727a; --turquesa-fundo: #ddf3f2;
    --sombra: 0 1px 2px rgba(16,32,24,.06), 0 4px 16px rgba(16,32,24,.06);
    --sombra-forte: 0 2px 4px rgba(16,32,24,.08), 0 12px 32px rgba(16,32,24,.12);
    color-scheme: light;
  }
  /* ============ CORES (tema escuro) ============ */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #0b171c;  --superficie: #12242b;  --superficie-2: #183039;
      --texto: #e6eef0;  --suave: #94a9af;       --borda: #22414b;
      --acento: #a8d35f; --acento-texto: #0b171c; --acento-suave: #1f3a28;
      --ok: #7fd99a;      --ok-fundo: #173a26;
      --atencao: #f2c14e; --atencao-fundo: #3a2f12;
      --perigo: #ff8a80;  --perigo-fundo: #42201e;
      --info: #82b8ff;    --info-fundo: #16304d;
      --roxo: #c7a6ff;    --roxo-fundo: #2c2145;
      --ardosia: #a9bde0; --ardosia-fundo: #1f2c40;
      --turquesa: #6fd8d8; --turquesa-fundo: #113a3c;
      --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --sombra-forte: 0 2px 4px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #0b171c;  --superficie: #12242b;  --superficie-2: #183039;
    --texto: #e6eef0;  --suave: #94a9af;       --borda: #22414b;
    --acento: #a8d35f; --acento-texto: #0b171c; --acento-suave: #1f3a28;
    --ok: #7fd99a;      --ok-fundo: #173a26;
    --atencao: #f2c14e; --atencao-fundo: #3a2f12;
    --perigo: #ff8a80;  --perigo-fundo: #42201e;
    --info: #82b8ff;    --info-fundo: #16304d;
    --roxo: #c7a6ff;    --roxo-fundo: #2c2145;
    --ardosia: #a9bde0; --ardosia-fundo: #1f2c40;
    --turquesa: #6fd8d8; --turquesa-fundo: #113a3c;
    --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --sombra-forte: 0 2px 4px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  /* ============ BASE ============ */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font-family: "Plus Jakarta Sans", system-ui, "Segoe UI", Roboto, sans-serif;
         font-size: 15px; line-height: 1.45; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .largura { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* ============ TOPO ============ */
  .topo { padding: 22px 0 6px; }
  .topo .largura { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center;
          background: var(--acento); color: var(--acento-texto); font-size: 24px; box-shadow: var(--sombra); }
  .marca h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
  .marca p { margin: 2px 0 0; color: var(--suave); font-size: .85rem; }
  .acoes-topo { display: flex; align-items: center; gap: 10px; flex: none; }
  .atualizado { color: var(--suave); font-size: .8rem; text-align: right; }
  .btn-tema { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--borda);
              background: var(--superficie); cursor: pointer; font-size: 18px; box-shadow: var(--sombra); }

  /* ============ RESUMO (3 números) ============ */
  .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px auto 0; }
  .stat { background: var(--superficie); border: 1px solid var(--borda); border-radius: 16px;
          padding: 14px 16px; box-shadow: var(--sombra); min-width: 0; }
  .stat .rotulo { color: var(--suave); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .stat .valor { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; margin-top: 2px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .detalhe { color: var(--suave); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.destaque { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
  .stat.destaque .rotulo, .stat.destaque .detalhe { color: inherit; opacity: .85; }

  /* ============ FILTROS ============ */
  .filtros { background: var(--superficie); border: 1px solid var(--borda); border-radius: 16px;
             padding: 14px 16px; margin: 12px auto 0; box-shadow: var(--sombra); display: grid; gap: 12px; }
  .linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .filtros > * { min-width: 0; }  /* deixa as linhas do grid encolherem no celular */
  .rotulo-filtro { font-size: .75rem; font-weight: 700; color: var(--suave); text-transform: uppercase;
                   letter-spacing: .05em; width: 52px; flex: none; }
  .chip { border: 1px solid var(--borda); background: var(--superficie); border-radius: 999px;
          padding: 7px 13px; font-size: .88rem; font-weight: 500; cursor: pointer; transition: .15s; }
  .chip:hover { border-color: var(--acento); }
  .chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); font-weight: 700; }
  .chip .n { opacity: .7; font-weight: 500; margin-left: 5px; font-size: .8rem; }
  .campo { border: 1px solid var(--borda); background: var(--superficie-2); border-radius: 10px; padding: 8px 10px; }
  input.campo[type=number] { width: 104px; }
  .preco-sep { color: var(--suave); font-size: .9rem; }
  details.mais { border-top: 1px dashed var(--borda); padding-top: 10px; }
  details.mais > summary { cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--suave); list-style: none;
                           display: inline-flex; align-items: center; gap: 6px; }
  details.mais > summary::-webkit-details-marker { display: none; }
  details.mais > summary::before { content: "▸"; transition: transform .15s; }
  details.mais[open] > summary::before { transform: rotate(90deg); }
  details.mais .conteudo { display: grid; gap: 10px; margin-top: 10px; }
  #busca { flex: 1 1 240px; min-width: 0; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: .9rem; cursor: pointer; }
  .check input { accent-color: var(--acento); width: 16px; height: 16px; }
  .link-limpar { background: none; border: 0; padding: 0; color: var(--acento); font-weight: 600;
                 cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ============ GRUPOS POR DIA ============ */
  main { padding-top: 8px; padding-bottom: 48px; }
  .dia { margin-top: 26px; }
  .dia-cab { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .dia-data { flex: none; width: 58px; text-align: center; border-radius: 14px; overflow: hidden;
              background: var(--superficie); border: 1px solid var(--borda); box-shadow: var(--sombra); }
  .dia-semana { display: block; background: var(--acento); color: var(--acento-texto);
                font-size: .7rem; font-weight: 800; letter-spacing: .08em; padding: 3px 0; }
  .dia-num { display: block; font-size: 1.05rem; font-weight: 800; padding: 4px 0 5px; }
  .dia-info h2 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; }
  .dia-info p { margin: 1px 0 0; color: var(--suave); font-size: .85rem; }
  .contagem { margin-left: auto; flex: none; font-size: .8rem; font-weight: 700; padding: 5px 11px;
              border-radius: 999px; background: var(--acento-suave); color: var(--acento); }
  .contagem.urgente { background: var(--perigo-fundo); color: var(--perigo); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }

  /* ============ CARD ============ */
  .card { background: var(--superficie); border: 1px solid var(--borda); border-radius: 18px; overflow: hidden;
          display: flex; flex-direction: column; box-shadow: var(--sombra); transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--sombra-forte); }
  .midia { position: relative; height: 132px; display: grid; place-items: center; background: var(--superficie-2); }
  .midia img { width: 100%; height: 100%; object-fit: cover; }
  .midia .icone { font-size: 52px; filter: saturate(.9); }
  .midia.cat-moto  { background: linear-gradient(135deg, var(--acento-suave), var(--superficie-2)); }
  .midia.cat-carro { background: linear-gradient(135deg, var(--info-fundo), var(--superficie-2)); }
  .midia.cat-pref  { background: linear-gradient(135deg, var(--roxo-fundo), var(--superficie-2)); }
  .selos { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; }
  .selo { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(4px); }
  .fonte-receita { background: var(--info-fundo); color: var(--info); }
  .fonte-prf { background: var(--atencao-fundo); color: var(--atencao); }
  .fonte-prefeitura { background: var(--roxo-fundo); color: var(--roxo); }
  .fonte-pf { background: var(--ardosia-fundo); color: var(--ardosia); }
  .fonte-detran { background: var(--ok-fundo); color: var(--ok); }
  .fonte-foztrans { background: var(--turquesa-fundo); color: var(--turquesa); }
  .selo.novo { background: var(--acento); color: var(--acento-texto); }

  .corpo { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .marca-veiculo { font-size: .72rem; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
  .titulo { margin: 0; font-size: 1.02rem; font-weight: 700; line-height: 1.25; }
  .preco { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .preco strong { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; color: var(--acento); }
  .preco span { color: var(--suave); font-size: .78rem; }
  .status { align-self: flex-start; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-ok { background: var(--ok-fundo); color: var(--ok); }
  .st-atencao { background: var(--atencao-fundo); color: var(--atencao); }
  .st-perigo { background: var(--perigo-fundo); color: var(--perigo); }
  .st-info { background: var(--info-fundo); color: var(--info); }
  .st-roxo { background: var(--roxo-fundo); color: var(--roxo); }
  .infos { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; color: var(--suave); font-size: .84rem; }
  .infos li { display: flex; gap: 7px; }
  .infos li span:first-child { flex: none; width: 18px; text-align: center; }
  .prazo { font-size: .82rem; font-weight: 700; color: var(--perigo); background: var(--perigo-fundo);
           border-radius: 10px; padding: 6px 10px; }
  .aviso { font-size: .8rem; color: var(--atencao); background: var(--atencao-fundo); border-radius: 10px; padding: 6px 10px; }
  .descricao { color: var(--suave); font-size: .85rem; display: -webkit-box; -webkit-line-clamp: 3;
               -webkit-box-orient: vertical; overflow: hidden; }
  .botoes { margin-top: auto; padding-top: 4px; display: flex; gap: 8px; }
  .btn { flex: 1; text-align: center; text-decoration: none; font-weight: 700; font-size: .86rem;
         padding: 9px 10px; border-radius: 11px; border: 1px solid var(--borda); transition: .15s; }
  .btn:hover { border-color: var(--acento); }
  .btn.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
  .btn.primario:hover { filter: brightness(1.07); }

  .vazio { text-align: center; color: var(--suave); padding: 48px 16px; }
  .vazio .grande { font-size: 44px; }
  footer { color: var(--suave); font-size: .8rem; text-align: center; padding: 0 16px 32px; }

  /* ============ CELULAR ============ */
  @media (max-width: 640px) {
    .topo { padding-top: 16px; }
    .atualizado { display: none; }
    .resumo { gap: 8px; }
    .stat { padding: 10px 12px; border-radius: 14px; }
    .stat .valor { font-size: 1.2rem; }
    .stat .rotulo { font-size: .68rem; }
    .stat .detalhe { font-size: .72rem; }
    .rotulo-filtro { width: 100%; }
    /* Botões numa linha só, rolando para o lado (em vez de quebrar em várias linhas). */
    /* min-width: 0 deixa o item encolher; sem isso ele estica a página para o lado. */
    .rolagem { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px;
               scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .rolagem::-webkit-scrollbar { display: none; }
    .rolagem .chip { flex: none; }
    .faixa { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; }
    details.mais .campo { flex: 1 1 100%; }
    .faixa input.campo[type=number] { width: 0; flex: 1 1 0; min-width: 0; }
    .grade { grid-template-columns: 1fr; }
    .contagem { display: none; }
  }
</style>
</head>
<body>

<header class="topo">
  <div class="largura">
    <div class="marca">
      <div class="logo" aria-hidden="true">🏍️</div>
      <div>
        <h1>Radar de Leilões</h1>
        <p>Foz do Iguaçu → Cascavel · Receita, PRF, PF, Detran, Foztrans e Prefeituras</p>
      </div>
    </div>
    <div class="acoes-topo">
      <div class="atualizado">Atualizado em<br><strong>23/11/2026 15:06</strong></div>
      <button class="btn-tema" id="btnTema" type="button" aria-label="Trocar tema claro/escuro"></button>
    </div>
  </div>
</header>

<section class="largura resumo" aria-label="Resumo">
  <div class="stat destaque"><div class="rotulo">Encontrados</div><div class="valor" id="stTotal">–</div><div class="detalhe" id="stTotalDet"></div></div>
  <div class="stat"><div class="rotulo">Menor lance</div><div class="valor" id="stMenor">–</div><div class="detalhe" id="stMenorDet"></div></div>
  <div class="stat"><div class="rotulo">Próximo leilão</div><div class="valor" id="stProx">–</div><div class="detalhe" id="stProxDet"></div></div>
</section>

<section class="largura">
  <div class="filtros">
    <div class="linha"><span class="rotulo-filtro">Tipo</span><span id="tipos" class="linha rolagem"></span></div>
    <div class="linha">
      <span class="rotulo-filtro">Preço</span>
      <span class="linha faixa">
        <input class="campo" id="minimo" type="number" min="0" step="500" placeholder="mínimo" aria-label="Preço mínimo">
        <span class="preco-sep">até</span>
        <input class="campo" id="maximo" type="number" min="0" step="500" placeholder="máximo" aria-label="Preço máximo">
      </span>
      <span class="linha rolagem">
        <button class="chip" data-faixa="0-3000">até 3 mil</button>
        <button class="chip" data-faixa="0-6000">até 6 mil</button>
        <button class="chip" data-faixa="0-15000">até 15 mil</button>
        <button class="chip" data-faixa="-">qualquer</button>
      </span>
    </div>
    <details class="mais" id="maisFiltros">
      <summary>Mais filtros</summary>
      <div class="conteudo">
        <div class="linha">
          <input class="campo" id="busca" type="search" placeholder="Buscar modelo (ex.: CG, Biz, Gol, 2015)">
          <select class="campo" id="fonte"><option value="">Todas as fontes</option></select>
          <select class="campo" id="cidade"><option value="">Todas as cidades</option></select>
          <select class="campo" id="ordem">
            <option value="preco">Em cada dia: menor preço</option>
            <option value="ano">Em cada dia: mais novo</option>
          </select>
        </div>
        <div class="linha">
          <label class="check"><input id="semSucata" type="checkbox" checked> Esconder sucata</label>
          <label class="check"><input id="soBr" type="checkbox" checked> Esconder placa estrangeira</label>
          <button class="link-limpar" id="limpar" type="button">Limpar filtros</button>
        </div>
      </div>
    </details>
  </div>
</section>

<main class="largura" id="lista"></main>
<footer>Dados públicos dos editais · Sempre leia o edital e visite o pátio antes de dar lance.</footer>

/* ---------- Partes de um card ---------- */
function classeStatus(i) {
  const s = (i.situacao || "").toLowerCase();
  if (i.tipo === "leilao") return "st-roxo";
  if (s.startsWith("sucata")) return "st-perigo";
  if (s.includes("regularizar") || s.includes("sem motor")) return "st-atencao";
  if (s.startsWith("circula") || s.startsWith("conservado")) return "st-ok";
  return "st-info";
}
function separarMarca(titulo) {
  // "HONDA/CG 125 FAN 2013" -> ["HONDA", "CG 125 FAN 2013"]
  // "JTA/SUZUKI EN125" -> ["SUZUKI", "EN125"]  (JTA e I/ são só prefixos de registro)
  const t = (titulo || "").trim().replace(/^(JTA|I|IMP)\//, "");
  const m = t.match(/^([^\s/]+)[\s/]+(.+)$/);
  return m ? [m[1], m[2]] : ["", t];
}
function local(i) {
  // Evita "Foz do Iguaçu · Pátio PRF - Foz do Iguaçu": se o pátio já cita a cidade, mostra só a cidade.
  const semAcento = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
  if (!i.patio || i.patio === i.cidade || semAcento(i.patio).includes(semAcento(i.cidade))) return i.cidade;
  return `${i.cidade} · ${i.patio}`;
}
function numeroLote(i) {
  const m = (i.edital || "").match(/lote\s*(\d+)/i);

}

  return (obs || "").split(" | ").filter(a => a && !a.startsWith("Datas do edital"));
}
function classeFonte(fonte) {
  const classes = { "Receita Federal": "fonte-receita", "PRF": "fonte-prf", "Polícia Federal": "fonte-pf",
                    "Detran-PR": "fonte-detran", "Foztrans": "fonte-foztrans" };
  return classes[fonte] || "fonte-prefeitura";
}
function classeMidia(cat) {
  return cat === "Moto" ? "cat-moto" : cat === "Leilão de prefeitura" ? "cat-pref" : "cat-carro";
}

function card(i) {
  const leilao = i.tipo === "leilao";
  // Prefeitura: o nome oficial vem sem acento ("Municipio De Sao Miguel..."), então usamos a cidade.

  const avisos = avisosUteis(i.obs).map(a => `<div class="aviso">⚠️ ${esc(a)}</div>`).join("");

  ].filter(Boolean).map(([ic, tx]) => `<li><span>${ic}</span><span>${esc(tx)}</span></li>`).join("");

  return `

      </div>
    </div>

}

function filtrar() {
  const min = parseFloat(estado.minimo) || 0;
  const max = parseFloat(estado.maximo) || Infinity;
  const busca = estado.busca.trim().toUpperCase();
  return ITENS.filter(i =>

    (i.valor_minimo == null || (i.valor_minimo >= min && i.valor_minimo <= max)) &&
    (!estado.fonte || i.fonte === estado.fonte) &&
    (!estado.cidade || i.cidade === estado.cidade) &&
    (!estado.semSucata || !ehSucata(i)) &&
    (!estado.soBr || !i.estrangeira) &&
    (!busca || `${i.titulo} ${i.descricao} ${i.cidade}`.toUpperCase().includes(busca)));
}

function desenharResumo(lista) {

  const menor = lotes.reduce((m, i) => (i.valor_minimo != null && (!m || i.valor_minimo < m.valor_minimo)) ? i : m, null);

  desenharResumo(lista);

  if (!estado.tipos.length) {
    $("lista").innerHTML = `<div class="vazio"><div class="grande">👆</div>Escolha pelo menos um tipo de veículo.</div>`;
    return;
  }
  if (!lista.length) {
    $("lista").innerHTML = `<div class="vazio"><div class="grande">🔍</div>Nada encontrado com esses filtros.<br>
      Tente aumentar a faixa de preço ou <button class="link-limpar" onclick="limpar()">limpar os filtros</button>.</div>`;
    return;
  }

  // Agrupa por dia do leilão.
  const grupos = new Map();
  for (const i of lista) {
    const dia = (i.data_leilao || "").slice(0, 10);
    if (!grupos.has(dia)) grupos.set(dia, []);
    grupos.get(dia).push(i);
  }
  const ordenar = estado.ordem === "ano"
    ? (a, b) => (b.ano || 0) - (a.ano || 0)
    : (a, b) => (a.valor_minimo ?? 1e12) - (b.valor_minimo ?? 1e12);

  $("lista").innerHTML = [...grupos.keys()].sort().map(dia => {
    const itens = grupos.get(dia).sort(ordenar);
    const d = dataDe(dia + " 12:00");
    const n = diasAte(dia + " 12:00");
    const fontes = [...new Set(itens.map(i => i.fonte))].join(" · ");
    return `
    <section class="dia">
      <header class="dia-cab">
        <div class="dia-data"><span class="dia-semana">${SEMANA[d.getDay()]}</span><span class="dia-num">${ddmm(dia + " 12:00")}</span></div>
        <div class="dia-info"><h2>${esc(fontes)}</h2><p>${itens.length} ${itens.length === 1 ? "item" : "itens"}</p></div>
        <span class="contagem ${n <= 2 ? "urgente" : ""}">${textoDias(n)}</span>
      </header>
      <div class="grade">${itens.map(card).join("")}</div>
    </section>`;
  }).join("");
}

function atualizar() { lerTela(); salvar(); mostrarNaTela(); desenhar(); }
function limpar() { estado = { ...PADRAO }; salvar(); mostrarNaTela(); desenhar(); }

document.querySelectorAll("[data-tipo]").forEach(b => b.addEventListener("click", () => {
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); atualizar();
}));
document.querySelectorAll("[data-faixa]").forEach(b => b.addEventListener("click", () => {
  const [mi, ma] = b.dataset.faixa.split("-");
  $("minimo").value = mi === "0" ? "" : mi; $("maximo").value = ma; atualizar();
}));
for (const id of ["minimo", "maximo", "busca", "fonte", "cidade", "ordem", "semSucata", "soBr"]) {
  $(id).addEventListener("input", atualizar);
}
$("limpar").addEventListener("click", limpar);

mostrarNaTela();
desenhar();
</script>
</body>
</html>
